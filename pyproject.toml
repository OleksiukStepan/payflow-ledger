[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "payflow-ledger"
version = "0.1.0"
description = "Ledger service for PayFlow corporate card webhooks"
requires-python = ">=3.11"
dependencies = [
    "alembic==1.20.0",
    "fastapi==0.142.2",
    "psycopg[binary]==3.3.6",
    "sqlalchemy==2.1.3",
    "uvicorn==0.54.0",
]

[project.optional-dependencies]
dev = [
    "bandit==1.9.4",
    "httpx==0.28.1",
    "hypothesis==6.168.3",
    "pip-audit==2.10.1",
    "pytest==9.1.1",
    "ruff==0.16.10",
]

# The service runs from the source tree; installing the project only pulls its dependencies.
[tool.setuptools]
packages = []

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
