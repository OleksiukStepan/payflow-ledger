name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: payflow
          POSTGRES_PASSWORD: payflow
          POSTGRES_DB: payflow
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U payflow -d payflow"
          --health-interval 2s --health-timeout 3s --health-retries 30
    env:
      DATABASE_URL: postgresql+psycopg://payflow:payflow@localhost:5432/payflow_test
      WEBHOOK_SECRET: whsec_test_123
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - run: pip install ".[dev]"
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Security lint (bandit)
        run: bandit -q -r app
      - name: Tests
        run: pytest -q

  compose:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Start the stack
        run: make up
      - name: Smoke check
        run: |
          curl -fsS http://localhost:8000/health
          curl -fsS -o /dev/null http://localhost:8000/
          curl -fsS -o /dev/null http://localhost:8000/static/dashboard.js
          curl -fsS -o /dev/null http://localhost:8000/docs
      - name: Replay every event file shuffled, duplicated and in parallel
        run: make verify
      - name: Replay again on the same database (idempotency)
        run: make verify
      - name: Logs on failure
        if: failure()
        run: docker compose logs
